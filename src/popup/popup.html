<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugReplay</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div id="bugreplay-popup">
        <header class="popup-header">
            <img class="popup-logo" src="/icons/icon-48.png" width="22" height="22" alt="" />
            <h1 class="popup-title">BugReplay</h1>
            <span id="status-badge" class="status-badge status-idle">就绪</span>
        </header>

        <main class="popup-main">
            <!-- 录制启动按钮 -->
            <section class="recording-controls">
                <button id="btn-record" class="btn btn-primary btn-lg">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
                    <span>开始录制</span>
                </button>
            </section>

            <p class="hint-text">
                录制开始后，页面底部会弹出统一工具栏，<br>
                可进行暂停/停止录制、绘制标注等操作。
            </p>

            <!-- 历史会话列表 -->
            <section class="sessions-section">
                <h2 class="section-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    历史录制
                </h2>
                <div id="sessions-list" class="sessions-list">
                    <p class="empty-state">暂无录制记录</p>
                </div>
            </section>
        </main>

        <footer class="popup-footer">
            <button id="btn-replay" class="btn btn-outline">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>回放</span>
            </button>
            <button id="btn-export" class="btn btn-outline" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>导出 .rrt</span>
            </button>
            <button id="btn-clipboard" class="btn btn-outline" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span>复制 JSON</span>
            </button>
        </footer>
    </div>

    <script type="module" src="popup.ts"></script>
</body>

</html>
