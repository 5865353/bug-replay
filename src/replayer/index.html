<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugReplay - 回放</title>
    <style>
        :root {
            --bg: #0f0f14; --surface: #18181f; --surface2: #1e1e28;
            --border: #2a2a38; --text: #cdd6f4; --text2: #9399b2; --text3: #585b70;
            --accent: #cba6f7; --accent2: #b4befe; --green: #a6e3a1;
            --yellow: #f9e2af; --red: #f38ba8; --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #404050; }

        /* ==================== Header ==================== */
        .header {
            display: flex; align-items: center; padding: 6px 14px;
            background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .header-logo-img { width: 22px; height: 22px; margin-right: 8px; }
        .header-logo { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
        .header-logo span { color: var(--accent); }
        #metadata-title { font-size: 13px; color: var(--text2); margin-left: 10px; max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn {
            padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 12px; cursor: pointer; background: var(--surface2); color: var(--text);
            font-weight: 500; transition: all .15s; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .btn:hover { background: #2a2a3a; border-color: #404050; }
        .btn-primary { background: var(--accent); color: #0f0f14; border-color: var(--accent); font-weight: 600; }
        .btn-primary:hover { background: var(--accent2); }
        .btn-sm { padding: 4px 8px; font-size: 11px; }

        /* ==================== Main Layout ==================== */
        .replayer-body { display: flex; flex: 1; overflow: hidden; min-height: 0; }

        /* ==================== Player Section ==================== */
        .player-section {
            flex: 1; display: flex; flex-direction: column;
            background: #0a0a10; min-width: 0; overflow: hidden;
        }
        .player-stage {
            flex: 1; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a10 70%);
        }
        .player-stage::before {
            content: ''; position: absolute; inset: -60px; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 30% 50%, rgba(203,166,247,0.06) 0%, transparent 50%),
                        radial-gradient(circle at 70% 30%, rgba(180,190,254,0.04) 0%, transparent 50%);
        }
        .player-stage-inner {
            position: relative; z-index: 1; overflow: hidden;
            border-radius: var(--radius);
            box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
            width: 100%; height: 100%;
        }

        #rrweb-player { width: 100%; height: 100%; position: relative; overflow: hidden; }
        #rrweb-player > div { width: 100% !important; height: 100% !important; overflow: hidden; }
        #rrweb-player iframe { border: none !important; }

        /* Drop zone */
        .drop-zone {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; color: var(--text3); background: #0f0f14;
            border: 2px dashed var(--border); border-radius: var(--radius);
            cursor: pointer; transition: all .2s;
        }
        .drop-zone:hover { border-color: var(--accent); color: var(--text2); }
        .drop-zone-icon { width: 56px; height: 56px; opacity: 0.5; }
        .drop-zone-text { font-size: 15px; font-weight: 500; }
        .drop-zone-hint { font-size: 12px; color: var(--text3); }

        /* ==================== Player Controls (Timeline) ==================== */
        #timeline {
            padding: 6px 12px; background: var(--surface);
            border-top: 1px solid var(--border); flex-shrink: 0; display: none;
        }
        .timeline-controls {
            display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
        }
        .btn-icon {
            background: none; border: none; color: var(--text2); font-size: 13px;
            cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: all .15s;
        }
        .btn-icon:hover { background: var(--surface2); color: var(--text); }
        #btn-play-pause {
            font-size: 14px; width: 28px; height: 28px; display: flex;
            align-items: center; justify-content: center; background: var(--accent);
            color: #0f0f14; border-radius: 50%; border: none; cursor: pointer;
        }
        #btn-play-pause:hover { background: var(--accent2); }
        .time-display { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text2); min-width: 36px; text-align: center; }
        .time-separator { color: var(--text3); font-size: 11px; }
        .timeline-bar-container { position: relative; height: 5px; background: var(--border); border-radius: 3px; cursor: pointer; }
        .timeline-progress { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; transition: width .1s linear; }
        .timeline-thumb {
            position: absolute; top: 50%; width: 14px; height: 14px;
            background: var(--accent); border: 2px solid #0f0f14;
            border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; opacity: 0;
        }
        .timeline-bar-container:hover .timeline-thumb { opacity: 1; }
        .speed-select {
            margin-left: auto; padding: 2px 6px; border: 1px solid var(--border);
            border-radius: 4px; background: transparent; color: var(--text2); font-size: 11px; cursor: pointer;
        }

        /* ==================== Controls bar (buttons + timeline) ==================== */
        .controls-row {
            display: flex; align-items: center; gap: 10px; padding: 6px 12px;
            background: var(--surface); border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .controls-row .spacer { flex: 1; }

        /* ==================== Right Panel (Tabs) ==================== */
        .right-panel {
            width: 380px; flex-shrink: 0; background: var(--surface);
            border-left: 1px solid var(--border); display: flex; flex-direction: column;
        }
        .right-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .right-tab {
            flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 500;
            background: none; border: none; border-bottom: 2px solid transparent;
            color: var(--text3); cursor: pointer; transition: all .15s;
        }
        .right-tab:hover { color: var(--text2); }
        .right-tab.active { color: var(--text); border-bottom-color: var(--accent); }
        .right-content { flex: 1; overflow-y: auto; }
        .right-tab-panel { display: none; padding: 12px 14px; }
        .right-tab-panel.active { display: block; }

        .info-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 3px 0; font-size: 12px; }
        .info-label { color: var(--text3); flex-shrink: 0; margin-right: 8px; }
        .info-value { color: var(--text2); text-align: right; word-break: break-all; max-width: 240px; }

        .keyframe-list { display: flex; flex-direction: column; gap: 2px; }
        .keyframe-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px;
            border-radius: 6px; cursor: pointer; transition: all .15s;
            font-size: 12px; border: 1px solid transparent;
        }
        .keyframe-item:hover { background: var(--surface2); }
        .keyframe-item.active { background: rgba(203,166,247,0.1); border-color: var(--accent); }
        .kf-step { background: var(--accent); color: #0f0f14; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
        .kf-type { font-size: 14px; flex-shrink: 0; }
        .kf-time { color: var(--text3); font-size: 10px; font-variant-numeric: tabular-nums; margin-left: auto; flex-shrink: 0; }
        .kf-desc { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .keyframe-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 16px 0; }

        /* ==================== Bottom Panel (Resizable) ==================== */
        .bottom-panel {
            height: 200px; flex-shrink: 0; background: var(--surface);
            display: flex; flex-direction: column; position: relative;
        }
        .bottom-panel.collapsed { height: 36px; }
        .bottom-panel.collapsed .devtools-content { display: none; }
        .resize-handle {
            position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: ns-resize; z-index: 10;
        }
        .resize-handle::after {
            content: ''; position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 3px; background: var(--border); border-radius: 2px;
        }
        .resize-handle:hover::after { background: var(--accent); }
        .devtools-tabs {
            display: flex; align-items: center; background: #0f0f14; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .devtools-tab {
            padding: 6px 14px; font-size: 12px; font-weight: 500;
            background: none; border: none; border-bottom: 2px solid transparent;
            color: var(--text3); cursor: pointer; transition: all .15s;
        }
        .devtools-tab:hover { color: var(--text2); }
        .devtools-tab.active { color: var(--text); border-bottom-color: var(--accent); }
        .devtools-spacer { flex: 1; }
        .devtools-close {
            padding: 4px 10px; font-size: 14px; cursor: pointer; border: none;
            background: none; color: var(--text3);
        }
        .devtools-close:hover { color: var(--text); }
        .devtools-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        #sidebar { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #sidebar .sidebar-tabs { display: none !important; }
        #sidebar .sidebar-search { padding: 6px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        #sidebar .search-input {
            width: 100%; padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
            background: #0f0f14; color: var(--text); font-size: 12px; outline: none;
        }
        #sidebar .search-input:focus { border-color: var(--accent); }
        #sidebar .sidebar-content { flex: 1; overflow-y: auto; padding: 4px 0; }
        .sidebar-item { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 12px; transition: background .15s; }
        .sidebar-item.past { opacity: 0.45; }
        .item-header { display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
        .item-header:hover { background: var(--surface2); }
        .item-time { color: var(--text3); font-variant-numeric: tabular-nums; min-width: 44px; font-size: 10px; }
        .item-method { font-weight: 700; min-width: 34px; font-size: 11px; }
        .item-status { font-weight: 600; min-width: 26px; font-size: 11px; }
        .item-duration { color: var(--text3); min-width: 40px; text-align: right; font-size: 10px; }
        .item-summary { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-expand { color: var(--text3); font-size: 10px; }
        .item-detail { padding: 8px; margin-top: 4px; background: #0f0f14; border-radius: 5px; font-size: 11px; color: #bac2de; }
        .detail-section { margin-bottom: 5px; }
        .detail-section strong { color: var(--accent); }
        .detail-code { background: #0f0f14; padding: 8px; border-radius: 4px; margin-top: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: 11px; color: #a6adc8; max-height: 150px; overflow-y: auto; }
        .status-ok { color: var(--green); } .status-redirect { color: var(--yellow); } .status-error { color: var(--red); }
        .error-text { color: var(--red); } .log-level { font-weight: 700; font-size: 10px; }

        .empty-state {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--text3); font-size: 13px; padding: 20px;
            text-align: center; flex-direction: column; gap: 6px;
        }
        .empty-state small { font-size: 11px; color: var(--text3); opacity: 0.7; }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <img class="header-logo-img" src="/icons/icon-16.png" alt="" />
        <span class="header-logo">Bug<span>Replay</span></span>
        <span id="metadata-title">— 回放</span>
    </header>

    <!-- Main Body -->
    <div class="replayer-body">
        <!-- Player Section -->
        <div class="player-section">
            <div class="player-stage" id="player-stage">
                <div class="player-stage-inner" id="stage-inner">
                    <div id="drop-zone" class="drop-zone">
                        <img class="drop-zone-icon" src="/icons/icon-16.png" alt="" style="width:56px;height:56px;opacity:0.5;" />
                        <div class="drop-zone-text">点击或拖放 .rrt 文件</div>
                        <div class="drop-zone-hint">支持 .rrt / .json 格式的录制回放文件</div>
                    </div>
                    <div id="rrweb-player" style="display:none;"></div>
                </div>
            </div>
            <!-- 控制条：按钮 + 进度条 -->
            <div class="controls-row" id="controls-row" style="display:none;">
                <label class="btn btn-primary btn-sm">
                    📂 打开
                    <input type="file" id="file-input" accept=".rrt,.json" style="display:none" />
                </label>
                <button id="btn-toggle-annotations" class="btn btn-sm" title="切换标注图层">🖊 标注</button>
                <button id="btn-replay" class="btn btn-sm" style="display:none;">↺ 重新播放</button>
                <span class="spacer"></span>
                <button id="btn-toggle-devtools" class="btn btn-sm" title="显示/隐藏控制台面板" style="display:none;">🔽 面板</button>
            </div>
            <div id="timeline"></div>
        </div>

        <!-- Right Panel (Tabs) -->
        <div class="right-panel" id="right-panel" style="display:none;">
            <div class="right-tabs">
                <button class="right-tab active" data-right-tab="meta">📹 录制信息</button>
                <button class="right-tab" data-right-tab="keyframes">🎬 关键帧</button>
            </div>
            <div class="right-content">
                <div class="right-tab-panel active" id="panel-meta">
                    <div id="meta-content"></div>
                    <div style="margin-top:14px;" id="env-content"></div>
                </div>
                <div class="right-tab-panel" id="panel-keyframes">
                    <div class="keyframe-list" id="keyframe-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom DevTools Panel -->
    <div class="bottom-panel" id="bottom-panel" style="display:none;">
        <div class="resize-handle" id="resize-handle"></div>
        <div class="devtools-tabs" id="devtools-tabs">
            <button class="devtools-tab active" data-devtools-tab="console">📋 控制台</button>
            <button class="devtools-tab" data-devtools-tab="network">🌐 网络</button>
            <div class="devtools-spacer"></div>
            <button class="devtools-close" id="devtools-close" title="折叠面板">╌</button>
        </div>
        <div class="devtools-content" id="devtools-content">
            <div id="sidebar"></div>
        </div>
    </div>

    <script type="module" src="/src/replayer/replayer.ts"></script>
</body>
</html>
