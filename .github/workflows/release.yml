name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package zip
        run: node scripts/package.mjs --no-build

      - name: Package crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: node scripts/pack-crx.mjs --no-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/bugreplay-v*.zip
            release/bugreplay-v*.crx
          generate_release_notes: true
